# Type-checking configuration for the tier-two prototype packages (ADR 0010).
#
#   mypy --config-file mypy-prototype.toml generation/neural/nn datasets/synthetic \
#        datasets/whole_organ \
#        training visualization experiments
#
# Python 3.12 is used only because NumPy's shipped stubs are written in 3.12 type
# syntax. The code runs on 3.11; the Step 4 suite verifies that by executing there.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

# Level 1 asset pipeline (ADR-L1-003). scikit-image, trimesh and nibabel ship no type
# information for the calls used here; this relaxes only the call check, only in this module.
[[tool.mypy.overrides]]
module = ["assets.meshes", "assets.phantom", "shapes.register", "shapes.generate", "shapes.validity"]
disallow_untyped_calls = false
